apiVersion: v1
kind: Service
metadata:
  name: homelab-api-metrics
  namespace: homelab
spec:
  clusterIP: None
  selector:
    app: homelab-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: homelab
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: homelab-api
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - homelab-api-metrics.homelab.svc.cluster.local
            type: A
            port: 8000
            refresh_interval: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.3
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: homelab
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http